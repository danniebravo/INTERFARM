{% extends "base.html" %}
{% block title %}Mi perfil · {{ brand.name }}{% endblock %}
{% block content %}
<h1 class="text-2xl font-extrabold text-gray-900 mb-5">Mi perfil</h1>

<div class="max-w-2xl bg-white rounded-2xl border border-black/5 p-6">
    <form method="post" action="{% url 'accounts:profile.update' %}" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        {% csrf_token %}
        <label class="text-sm font-semibold">Nombre
            <input type="text" name="first_name" value="{{ account.first_name|default:'' }}" class="mt-1 w-full rounded-lg border border-black/15 px-3 py-2 text-sm">
        </label>
        <label class="text-sm font-semibold">Apellido
            <input type="text" name="last_name" value="{{ account.last_name|default:'' }}" class="mt-1 w-full rounded-lg border border-black/15 px-3 py-2 text-sm">
        </label>
        <label class="text-sm font-semibold">Correo
            <input type="email" name="email" value="{{ account.email }}" class="mt-1 w-full rounded-lg border border-black/15 px-3 py-2 text-sm">
        </label>
        <label class="text-sm font-semibold">Teléfono
            <input type="text" name="phone" value="{{ account.phone|default:'' }}" class="mt-1 w-full rounded-lg border border-black/15 px-3 py-2 text-sm">
        </label>

        <div class="md:col-span-2 border-t border-black/5 pt-4 mt-2">
            <p class="text-sm font-bold text-gray-700 mb-2">Cambiar contraseña (opcional)</p>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <label class="text-sm font-semibold">Nueva contraseña
                    <input type="password" name="password" autocomplete="new-password" class="mt-1 w-full rounded-lg border border-black/15 px-3 py-2 text-sm">
                </label>
                <label class="text-sm font-semibold">Confirmar contraseña
                    <input type="password" name="password_confirmation" autocomplete="new-password" class="mt-1 w-full rounded-lg border border-black/15 px-3 py-2 text-sm">
                </label>
            </div>
        </div>

        <div class="md:col-span-2">
            <button class="rounded-xl bg-brand hover:bg-brand-dark px-5 py-3 text-sm font-semibold text-white shadow-glow">Guardar cambios</button>
        </div>
    </form>
</div>
{% endblock %}
