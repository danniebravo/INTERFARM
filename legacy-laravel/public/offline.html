<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#166534">
    <title>InterFarm sin conexión</title>
    <style>
        :root {
            color-scheme: light dark;
            --brand: #166534;
            --text: #102018;
            --muted: #637268;
            --card: rgba(255,255,255,.82);
            --border: rgba(16,32,24,.10);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --text: #f8fafc;
                --muted: #cbd5e1;
                --card: rgba(15,23,42,.88);
                --border: rgba(255,255,255,.10);
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--text);
            background:
                radial-gradient(800px 460px at 16% 10%, rgba(22,101,52,.18), transparent 62%),
                linear-gradient(135deg, #eef4ef, #f8fafc);
        }

        @media (prefers-color-scheme: dark) {
            body {
                background:
                    radial-gradient(800px 460px at 16% 10%, rgba(34,197,94,.14), transparent 62%),
                    linear-gradient(135deg, #020617, #0f172a);
            }
        }

        .card {
            width: min(100%, 520px);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 28px;
            background: var(--card);
            box-shadow: 0 24px 60px rgba(0,0,0,.14);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        img {
            width: 74px;
            height: 74px;
            object-fit: contain;
            border-radius: 20px;
            background: rgba(22,101,52,.08);
            padding: 10px;
        }

        h1 {
            margin: 22px 0 8px;
            font-size: 28px;
            line-height: 1.1;
        }

        p {
            margin: 0;
            color: var(--muted);
            font-weight: 650;
            line-height: 1.55;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 24px;
        }

        button, a {
            border: 0;
            border-radius: 14px;
            padding: 12px 16px;
            font: inherit;
            font-weight: 850;
            text-decoration: none;
            cursor: pointer;
        }

        button {
            background: var(--brand);
            color: white;
        }

        a {
            color: var(--brand);
            background: rgba(22,101,52,.10);
        }
    </style>
</head>
<body>
    <main class="card">
        <img src="/images/apple-touch-icon.png?v=3" alt="InterFarm">
        <h1>Estás sin conexión</h1>
        <p>
            Puedes seguir usando las pantallas que ya abriste. Los registros que guardes sin internet quedarán en espera y se enviarán cuando vuelva la conexión.
        </p>
        <div class="actions">
            <button type="button" onclick="location.reload()">Intentar de nuevo</button>
            <a href="/dashboard">Ir al panel</a>
        </div>
    </main>
</body>
</html>
